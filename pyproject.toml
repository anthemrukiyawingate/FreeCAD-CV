[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexcad"
version = "0.1.0rc1"
description = "A typed cross-platform FreeCAD curriculum and interactive CAD laboratory"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "CortexCAD contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.11,<1"]
notebooks = ["jupyterlab>=4.3,<5", "ipykernel>=6.29,<8", "nbformat>=5.10,<6", "nbclient>=0.10,<1"]
mcp = ["mcp>=1.12,<2"]

[tool.setuptools.packages.find]
include = ["cortexcad*"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
